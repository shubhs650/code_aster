variables:
  GIT_STRATEGY: fetch
  # only 'prepare' download more revisions to search the last tag
  GIT_DEPTH: 100
  MINIO_URL: https://minio.retd.edf.fr
  ROOT_URL: https://$GITLAB_TOKEN_NAME:$GITLAB_TOKEN@gitlab.pleiade.edf.fr/codeaster
  PREREQ_VERSION: 20251026
  OSNAME: debian-12
  IMAGE_URL: ${DOCKER_NEXUS_URL}/codeaster-prerequisites:${PREREQ_VERSION}-${OSNAME}
  ASTER_BUILD: mpi
  ASTER_SKIP_CHECK_UPDATES: 1
  # BUILDTYPE: ci, nightly, nightly-coverage, nightly-sanitize, code-checking, docker
  BUILDTYPE: ci
  # RUNNER_TAG_TEST: allow to override the runner for running tests (in schedule parameters)
  RUNNER_TAG_TEST: hulk
  REFREV: ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}
  GIT_SSL_NO_VERIFY: "true"
  NPROC_MAX: 12
  FF_DISABLE_UMASK_FOR_DOCKER_EXECUTOR: "true"
  PIXI_HOME: ${CI_PROJECT_DIR}/.pixi
  # WEEKLY_RUN should be set in scheduled pipeline
  WEEKLY_RUN: "unset"
  TZ: "Europe/Paris"
  UV_DEFAULT_INDEX: "https://nexus.retd.edf.fr/repository/pypi-all/simple"
  UV_INSECURE_HOST: "https://nexus.retd.edf.fr"

default:
  tags:
    - docker-executor

workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_REF_NAME == "main" && $CI_PIPELINE_SOURCE == "schedule"
      variables:
        REFREV: main
    - if: $CI_PIPELINE_SOURCE == "web"
      variables:
        REFREV: main
    - if: $BUILDTYPE == "code-checking"
    - if: $BUILDTYPE == "docker"

  auto_cancel:
    on_new_commit: interruptible

stages:
  - setup
  - build
  - test
  - code-checking

image:
  name: ${IMAGE_URL}

before_script:
  - echo "started at $(date), day '$(date +%u)', weekly run on day '${WEEKLY_RUN}'"
  - export PATH="${PIXI_HOME}/bin:${PATH}"

.prepare:
  interruptible: true
  stage: setup
  variables:
    GIT_DEPTH: 300
  script:
    - .gitlabci/setup_pixi.sh
    - .gitlabci/prepare.sh
    - .gitlabci/version_info.sh
  artifacts:
    reports:
      dotenv: version.env
    paths:
      - devtools/*
      - data-src/*
      - .pixi/*
      - code_aster/pkginfo.py
    expire_in: 6 hours
  rules:
    - if: $BUILDTYPE != "code-checking"

.compile:
  interruptible: true
  stage: build
  script:
    - .gitlabci/compile.sh
  artifacts:
    when: always
    paths:
      - .lock*
      - build/*
      - install/*
    expire_in: 6 hours
  rules:
    - if: $BUILDTYPE != "code-checking" && $BUILDTYPE != "docker"

doc_html:
  interruptible: true
  stage: build
  needs: ["prepare", "compile"]
  script:
    - .gitlabci/doc_html.sh
  artifacts:
    paths:
      - install/share/doc/html/*
    expire_in: 3 days
  rules:
    - if: $CI_MERGE_REQUEST_IID

minimal_build:
  interruptible: true
  stage: test
  needs:
    - job: prepare
    - job: compile
      artifacts: false
    - job: check_source
      artifacts: false
  script:
    - .gitlabci/compile_minimal.sh
  rules:
    - if: $CI_MERGE_REQUEST_IID

check_source:
  interruptible: true
  stage: test
  needs: ["prepare", "compile"]
  script:
    - .gitlabci/check_source.sh
  artifacts:
    paths:
      - list_issues.txt
    expire_in: 3 days
  rules:
    - if: $CI_MERGE_REQUEST_IID

check_issues:
  interruptible: true
  stage: test
  needs: ["prepare", "check_source"]
  script:
    - .gitlabci/check_issues.sh
  rules:
    - if: $CI_MERGE_REQUEST_IID

minimal_test:
  interruptible: true
  stage: test
  needs: ["prepare", "compile"]
  script:
    - .gitlabci/test.sh
        -R "(asrun0|mumps02b|supv002|vocab0|zzzz509j)"
        --resutest=results_mini
  artifacts:
    when: always
    paths:
      - results_mini/run_testcases.xml
      - results_mini/Testing/Temporary/*
      - results_mini/*
    expire_in: 3 days
    reports:
      junit: results_mini/run_testcases.xml
  rules:
    - if: $CI_MERGE_REQUEST_IID

.verification_test:
  interruptible: true
  stage: test
  rules:
    - if: $BUILDTYPE != "code-checking" && $BUILDTYPE != "docker"
  tags:
    - $RUNNER_TAG_TEST
  script:
    - .gitlabci/test.sh
        -L verification
        --resutest=results
  artifacts:
    when: always
    paths:
      - results/*
    expire_in: 3 days
    reports:
      junit: results/run_testcases.xml

known_failures_test:
  interruptible: true
  stage: test
  needs:
    - job: prepare
    - job: compile
    - job: minimal_test
      artifacts: false
  script:
    - .gitlabci/test.sh
        --testlist .gitlabci/known_failures-pleiade.list
        --resutest=results_failures
  allow_failure: true
  artifacts:
    when: always
    paths:
      - results_failures/run_testcases.xml
      - results_failures/Testing/Temporary/*
      - results_failures/*
    expire_in: 3 days
    reports:
      junit: results_failures/run_testcases.xml
  rules:
    - if: $CI_MERGE_REQUEST_IID

sonarqube:
  interruptible: true
  stage: code-checking
  image:
    name: nexus.retd.edf.fr:5012/sonarsource/sonar-scanner-cli:latest
    entrypoint: ["/bin/sh", "-c"]
  script:
    - sonar-scanner
        -Dsonar.projectKey="gitlab-${CI_PROJECT_ID}"
        -Dsonar.projectName="${CI_PROJECT_PATH_SLUG}"
        -Dsonar.host.url="${SQ_SERVER}"
        -Dsonar.login="${SQ_TOKEN}"
        -Dsonar.projectBaseDir=.
        -Dsonar.sources=.
        -Dsonar.exclusions="data,extern,waf*,**/*.export,build/**,install/**"
        -Dsonar.python.file.suffixes=py,comm,com0,com1,com2
        -Dsonar.issue.ignore.multicriteria=f1
        -Dsonar.issue.ignore.multicriteria.f1.ruleKey=f90-rules:F90.DESIGN.Include
        -Dsonar.issue.ignore.multicriteria.f1.resourceKey="f90-rules:**/*.F90"
        -Dsonar.scanner.javaOpts="-Xmx2G -Xms512M -XX:+HeapDumpOnOutOfMemoryError"
  variables:
    SQ_SERVER: "https://sonar.pleiade.edf.fr:443"
  allow_failure: true
  rules:
    - if: $BUILDTYPE == "code-checking"

docker:
  stage: build
  image: docker:29.4.0-cli
  services:
    - docker:29.4.0-dind
  before_script:
    - docker info
  needs:
    - job: prepare
  variables:
    # When you use the dind service, you must instruct Docker to talk with
    # the daemon started inside of the service. The daemon is available
    # with a network connection instead of the default
    # /var/run/docker.sock socket. Docker 19.03 does this automatically
    # by setting the DOCKER_HOST in
    # https://github.com/docker-library/docker/blob/d45051476babc297257df490d22cbd806f1b11e4/19.03/docker-entrypoint.sh#L23-L29
    #
    # The 'docker' hostname is the alias of the service container as described at
    # https://docs.gitlab.com/ci/services/#accessing-the-services.
    #
    # This instructs Docker not to start over TLS.
    DOCKER_TLS_CERTDIR: ""
    variant: "${OSNAME}"
    baseimage: "${DOCKER_NEXUS_URL}/codeaster-prerequisites:${PREREQ_VERSION}-${variant}"
  script:
    - echo "+ $(date) - building code_aster Docker image from ${baseimage}..."
    - echo "${DOCKER_NEXUS_PASSWD}" | docker login ${DOCKER_NEXUS_URL} -u "${DOCKER_NEXUS_USER}" --password-stdin
    - imgtag="main-${variant}"
    - test "${VERSION_DISTANCE}" = "0" && imgtag="${VERSION_TAG}-${variant}"
    - dest="${DOCKER_NEXUS_URL}/codeaster:${imgtag}"
    - docker build
        --build-arg baseimage=${baseimage}
        --build-arg variant=${variant}
        --build-arg BRANCH=${VERSION_BRANCH}
        --build-arg PKGINFO="$(cat code_aster/pkginfo.py)"
        -t ${dest}
        -f containers/Containerfile .
    - docker image push ${dest}

  allow_failure: true
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH && $BUILDTYPE == "nightly"
    - if: $BUILDTYPE == "docker"
    - if: $BUILDTYPE == "code-checking"
      when: never
    - when: manual
      allow_failure: true

# --- default build
prepare:
  extends: .prepare

compile:
  extends: .compile
  needs:
    - job: prepare

verification_test:
  extends: .verification_test
  needs:
    - job: prepare
    - job: compile
    - job: minimal_test
      artifacts: false
      optional: true
    - job: check_source
      artifacts: false
      optional: true
    - job: doc_html
      artifacts: false
      optional: true

# --- additional analysis
keywords_coverage:
  interruptible: true
  stage: code-checking
  needs:
    - job: prepare
    - job: compile
    - job: verification_test
  script:
    - do_upload="no"
    - test "$(date +%u)" = "${WEEKLY_RUN}"
        && test "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH"
        && test "${BUILDTYPE}" = "nightly"
        && do_upload="upload"
    - .gitlabci/coverage.sh . ./install ./results "${do_upload}"
  artifacts:
    when: always
    paths:
      - build/coverage/*
  rules:
    - if: $BUILDTYPE == "ci"
      when: on_success
    - if: $BUILDTYPE == "nightly"
      when: always
  allow_failure: true

perf_analysis:
  interruptible: true
  image:
    name: nexus.retd.edf.fr:5012/debian:trixie
  stage: code-checking
  needs:
    - job: prepare
    - job: verification_test
  script:
    - apt-get update
    - apt-get install -y python3 python3-numpy python3-pandas jq
    - do_upload="no"
    - test "$(date +%u)" = "${WEEKLY_RUN}"
        && test "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH"
        && test "${BUILDTYPE}" = "nightly"
        && do_upload="upload"
    - .gitlabci/perf.sh ./results "${do_upload}"
  artifacts:
    when: always
    paths:
      - build/perf/*
  rules:
    - if: $BUILDTYPE == "ci"
      when: on_success
    - if: $BUILDTYPE == "nightly"
      when: always
  allow_failure: true

# --- variant debian-next for nightly build: no image available
prepare_debian-next:
  variables:
    OSNAME: debian-13
  extends: .prepare
  rules:
    - if: $BUILDTYPE == "nightly"
      when: on_success
    - when: manual
      allow_failure: true

compile_debian-next:
  variables:
    OSNAME: debian-13
  extends: .compile
  needs:
    - job: prepare_debian-next
      optional: true

verification_test_debian-next:
  variables:
    OSNAME: debian-13
  extends: .verification_test
  needs:
    - job: prepare_debian-next
      optional: true
    - job: compile_debian-next
      optional: true
  allow_failure: true

# --- variant using code-aster-reqs package for nightly build / weekly testing
prepare_pkg:
  image:
    name: nexus.retd.edf.fr:5075/debian-base:trixie
  variables:
    OSNAME: pkg
  extends: .prepare
  script:
    - !reference [.prepare, script]
  rules:
    - if: $BUILDTYPE == "nightly"
      when: on_success
    - when: manual
      allow_failure: true

compile_pkg:
  image:
    name: nexus.retd.edf.fr:5075/debian-base:trixie
  variables:
    OSNAME: pkg
    ASTER_REQS_CONFIRM: y
  extends: .compile
  needs:
    - job: prepare_pkg
      optional: true
  script:
    - !reference [.compile, script]

verification_test_pkg:
  image:
    name: nexus.retd.edf.fr:5075/debian-base:trixie
  variables:
    OSNAME: pkg
    OMPI_MCA_plm: ^rsh
  extends: .verification_test
  needs:
    - job: prepare_pkg
      optional: true
    - job: compile_pkg
      optional: true
  script:
    - test "$(date +%u)" != "${WEEKLY_RUN}" && echo "not run" && exit 0
    - !reference [.verification_test, script]
  allow_failure: true

# --- variant win for nightly build / weekly testing
prepare_win:
  variables:
    OSNAME: win
  extends: .prepare
  script:
    - .gitlabci/prepare.sh
  rules:
    - if: $BUILDTYPE == "nightly"
      when: on_success
    - when: manual
      allow_failure: true

compile_win:
  variables:
    OSNAME: win
  extends: .compile
  needs:
    - job: prepare_win
      optional: true
  script:
    - !reference [.compile, script]

verification_test_win:
  variables:
    OSNAME: win
  extends: .verification_test
  needs:
    - job: prepare_win
      optional: true
    - job: compile_win
      optional: true
  script:
    - test "$(date +%u)" != "${WEEKLY_RUN}" && echo "not run" && exit 0
    - !reference [.verification_test, script]
  allow_failure: true

# --- variant using pixi for nightly build / weekly testing
prepare_pixi:
  image:
    name: nexus.retd.edf.fr:5075/debian-base:trixie
  variables:
    OSNAME: pixi
  extends: .prepare
  script:
    - !reference [.prepare, script]
  rules:
    - if: $BUILDTYPE == "nightly"
      when: on_success
    - when: manual
      allow_failure: true

compile_pixi:
  image:
    name: nexus.retd.edf.fr:5075/debian-base:trixie
  variables:
    OSNAME: pixi
  extends: .compile
  needs:
    - job: prepare_pixi
      optional: true
  script:
    - pixi list --explicit
    - ls -la ${PIXI_HOME} || true
    - pixi run .gitlabci/compile.sh

verification_test_pixi:
  image:
    name: nexus.retd.edf.fr:5075/debian-base:trixie
  variables:
    OSNAME: pixi
  extends: .verification_test
  needs:
    - job: prepare_pixi
      optional: true
    - job: compile_pixi
      optional: true
  script:
    - test "$(date +%u)" != "${WEEKLY_RUN}" && echo "not run" && exit 0
    - ls -la ${PIXI_HOME} || true
    - pixi run .gitlabci/test.sh
        -L verification
        --resutest=results
  allow_failure: true
